services:
  postgres:
    image: postgres:15-alpine
    container_name: baby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: baby_dev
      POSTGRES_DB: baby_weaning
      TZ: Asia/Taipei
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baby -d baby_weaning']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: baby-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: galkaev

volumes:
  postgres-data:
