# Render Blueprint — deploys the @baby/api service. The database is now
# Supabase-hosted PostgreSQL (no longer a Render-managed DB).
# Docs: https://render.com/docs/blueprint-spec
#
# The Docker build context is the repo ROOT (the Dockerfile copies
# pnpm-workspace.yaml / lockfile / packages), so dockerContext must be ".".
#
# DB connection strings are SECRETS (contain the password) and are set in the
# Render Dashboard (sync: false) — never commit them. Use the Supabase POOLER
# host (aws-1-<region>.pooler.supabase.com), which is IPv4-reachable from Render
# (the direct db.<ref>.supabase.co host is IPv6-only):
#   DATABASE_URL -> transaction pooler, port 6543, ?pgbouncer=true&connection_limit=1&sslmode=require  (runtime queries)
#   DIRECT_URL   -> session pooler,     port 5432, ?sslmode=require                                     (prisma migrate deploy on start)
# Migrations run automatically on container start via the Dockerfile CMD
# (`prisma migrate deploy`), which requires DIRECT_URL.

services:
  - type: web
    name: babyapp-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # Supabase transaction pooler (6543). Set in Dashboard — do not commit.
      - key: DATABASE_URL
        sync: false
      # Supabase session pooler (5432), used by `prisma migrate deploy`.
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # 前端的 Vercel 正式網域;若 rewrite 走 server-side proxy 其實用不到 CORS,
      # 但保留以支援前端直接呼叫的情境。多個來源用逗號分隔。
      - key: CORS_ORIGIN
        value: https://babyappweb2.vercel.app
      # 不要設 PORT:Render 會自動注入 PORT,API 的 env.PORT 會自動讀取它。
